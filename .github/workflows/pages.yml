# Déploiement GitHub Pages depuis main. Tout push sur main est en ligne (cf RELEASE.md).
# `enablement: true` active Pages en mode « GitHub Actions » au premier run, sans passer par les réglages.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Seuls les fichiers du site partent en ligne : pas de README, RELEASE, outils ni workflow (aucune trace du dépôt sur le site).
      - name: Assembler le site
        run: rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='RELEASE.md' --exclude='tools' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
