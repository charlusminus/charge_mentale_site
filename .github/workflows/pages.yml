# Déploiement GitHub Pages depuis main. Tout push sur main est en ligne (cf RELEASE.md).
# `enablement: true` active Pages en mode « GitHub Actions » au premier run, sans passer par les réglages.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Seuls les fichiers du site partent en ligne : pas de README, RELEASE, outils ni workflow (aucune trace du dépôt sur le site).
      - name: Assembler le site
        run: rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='RELEASE.md' --exclude='tools' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages échoue parfois juste après l'upload (« Fetching artifact metadata failed »,
      # le 23/11 et le 24/11) : l'artefact n'est pas encore visible. On attend et on retente une fois.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deploy
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
