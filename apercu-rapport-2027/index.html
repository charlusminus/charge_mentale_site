const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function ouvrir(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(D.s), iterations: D.k, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.i) }, cle, b64(D.c));
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(clair), "text/html");
  document.title = doc.title;
  document.head.querySelectorAll("style").forEach(s => s.remove());
  doc.head.querySelectorAll("style").forEach(s => document.head.appendChild(s));
  document.body.replaceWith(doc.body);
  window.scrollTo(0, 0);
}
document.getElementById("f").addEventListener("submit", async ev => {

  const err = document.getElementById("err"); err.textContent = "";

});
